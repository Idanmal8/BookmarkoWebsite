<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/src/assets/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmarko - Save and organize your wisdom</title>
    <meta name="description" content="Bookmarko is the ultimate tool for bookmarking and organizing your digital life." />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@700&family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- SPA GitHub Pages fallback: restore the original path that 404.html encoded into the query string. -->
    <script>
      (function () {
        var l = window.location;
        if (!l.search) return;
        var raw = l.search.slice(1); // strip leading "?"
        if (raw.indexOf('p=/') !== 0 && raw.indexOf('&p=/') === -1) return;
        var q = raw.split('&').reduce(function (acc, kv) {
          var i = kv.indexOf('=');
          var k = i < 0 ? kv : kv.slice(0, i);
          var v = i < 0 ? '' : decodeURIComponent(kv.slice(i + 1).replace(/~and~/g, '&'));
          acc[k] = v;
          return acc;
        }, {});
        if (q.p) {
          var base = l.pathname.endsWith('/') ? l.pathname.slice(0, -1) : l.pathname;
          var newUrl = base + q.p + (q.q ? '?' + q.q : '') + l.hash;
          window.history.replaceState(null, '', newUrl);
        }
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
