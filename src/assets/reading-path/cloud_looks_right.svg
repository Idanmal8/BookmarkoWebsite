<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 100 100" ><style>
/* he floats, rocking gently, as if lying on a lilo */
#cl_float { animation: cl_float 4s infinite ease-in-out; }
@keyframes cl_float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
#cl_rock { transform-box: fill-box; transform-origin: 50% 60%; animation: cl_rock 8s infinite ease-in-out; }
@keyframes cl_rock { 0%, 100% { transform: rotate(4deg); } 50% { transform: rotate(6deg); } }
#cl_shadow { transform-box: fill-box; transform-origin: 50% 50%; animation: cl_shadow 4s infinite ease-in-out; }
@keyframes cl_shadow { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.94); opacity: .8; } }
/* a bird crosses the sky, and his eyes go with it */
#cl_bird { animation: cl_bird 8s infinite linear; opacity: 0; }
@keyframes cl_bird { 0%, 8% { opacity: 0; transform: translate(0, 0); } 14% { opacity: 1; } 56% { opacity: 1; } 62%, 100% { opacity: 0; transform: translate(62px, -6px); } }
#cl_eyes { animation: cl_eyes 8s infinite ease-in-out; }
@keyframes cl_eyes { 0%, 10% { transform: translate(-.9px, 0); } 58% { transform: translate(1.1px, -.2px); } 70%, 100% { transform: translate(-.9px, 0); } }
#cl_shut_l, #cl_shut_r { transform-box: fill-box; transform-origin: 50% 0%; animation: cl_lid 8s infinite; }
@keyframes cl_lid { 0%, 100%, 74%, 77.2% { transform: scaleY(0); animation-timing-function: ease-in; } 75.2%, 76% { transform: scaleY(1); animation-timing-function: ease-out; } }
#cl_lash_l, #cl_lash_r { opacity: 0; animation: cl_lash 8s infinite linear; }
@keyframes cl_lash { 0%, 100% { opacity: 0; } 74.71% { opacity: 0; } 74.72%, 76.48% { opacity: 1; } 76.49% { opacity: 0; } }
