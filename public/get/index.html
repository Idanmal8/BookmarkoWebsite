<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get Bookmarko</title>
  <meta name="description" content="Bookmarko — track your reading, see your month in books." />
  <meta property="og:title" content="Get Bookmarko" />
  <meta property="og:description" content="Track your reading and see your month in books." />
  <meta property="og:image" content="https://bookmark-o.com/og-welcome.png" />
  <link rel="icon" href="/favicon.ico" />
  <!--
    Smart download link — see tasks/READING_CALENDAR_SHARE.md.

    Printed on every shared reading-calendar image, so this path must never
    move. A static file (not a Vue route) so GitHub Pages serves it directly
    and the redirect happens before any app bundle loads:
      iOS / iPadOS → App Store, Android → Google Play, anything else → the
      landing below with both badges.

    `?ref=` (e.g. `calendar`) is sent to GA as `get_link_opened` and passed to
    Play as the install referrer, so installs from shared images are countable.

    Future: once Universal Links / App Links are set up for bookmark-o.com
    (paths `/get*`), an installed app intercepts this URL before the page
    loads; nothing here needs to change for that.
  -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #5170ff;
      --text: #1a1a2e;
      --text-muted: #555577;
      --bg: #fafafa;
      --surface: #ffffff;
      --border: #e8e8f0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    main {
      width: 100%;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
    }
    img.logo { width: 72px; height: 72px; border-radius: 16px; }
    h1 { font-size: 1.5rem; margin: 16px 0 8px; }
    p { color: var(--text-muted); line-height: 1.5; margin-bottom: 24px; }
    .stores { display: flex; flex-direction: column; gap: 12px; }
    .stores a {
      display: block;
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--text);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
    .stores a.play { background: var(--primary); }
    .home { display: inline-block; margin-top: 20px; color: var(--text-muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/apple-touch-icon.png" alt="Bookmarko" />
    <h1>Get Bookmarko</h1>
    <p>Track your reading, and see your month in books.</p>
    <div class="stores">
      <a id="ios" href="https://apps.apple.com/app/id6762641879">Download on the App Store</a>
      <a id="android" class="play" href="https://play.google.com/store/apps/details?id=com.idanmal.bookmarko">Get it on Google Play</a>
    </div>
    <a class="home" href="/">bookmark-o.com</a>
  </main>

  <script>
    (function () {
      var APP_STORE = 'https://apps.apple.com/app/id6762641879';
      var PLAY_STORE = 'https://play.google.com/store/apps/details?id=com.idanmal.bookmarko';
      // Public GA4 measurement ID, same property the SPA uses. Only reported
      // from the real domain so local previews stay out of production data.
      var GA_ID = 'G-5C3LGSD51W';

      var params = new URLSearchParams(window.location.search);
      var ref = (params.get('ref') || 'direct').replace(/[^a-z0-9_-]/gi, '').slice(0, 32) || 'direct';

      var ua = navigator.userAgent || '';
      // iPadOS reports itself as a Mac; a touch screen gives it away.
      var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
        (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);
      var platform = isIOS ? 'ios' : isAndroid ? 'android' : 'other';

      var playUrl = PLAY_STORE + '&referrer=' +
        encodeURIComponent('utm_source=' + ref + '&utm_medium=share');
      document.getElementById('android').href = playUrl;

      var target = isIOS ? APP_STORE : isAndroid ? playUrl : null;
      var went = false;
      function go() {
        if (went || !target) return;
        went = true;
        window.location.replace(target);
      }

      if (window.location.hostname === 'bookmark-o.com') {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        window.gtag('js', new Date());
        window.gtag('config', GA_ID);
        window.gtag('event', 'get_link_opened', {
          ref: ref,
          platform: platform,
          event_callback: go,
        });
        // Never hold the reader hostage to analytics: redirect regardless.
        setTimeout(go, 700);
      } else {
        go();
      }
    })();
  </script>
</body>
</html>
